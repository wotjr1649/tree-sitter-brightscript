name: Three-OS native qualification

on:
  workflow_dispatch:
  push:
    branches: [main, session/10-v014-native-parity]
    paths:
      - .github/workflows/native-qualification.yml
      - scripts/qualify/**
      - scripts/build_native_evidence.py
      - scripts/check_oracle_pair.py
      - scripts/compare_native_evidence.py
      - scripts/package_native_evidence.py
      - scripts/record_oracle.py

permissions:
  contents: read

jobs:
  native-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tree-sitter/tree-sitter
          ref: 6070dbfefd326bd735e5683eb128cc1b57dad0c0
          path: .work/runtime-027
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tree-sitter/tree-sitter
          ref: f5afe475deb7c0bae6407fb776c76824f717bb61
          path: .work/runtime-025
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tree-sitter/tree-sitter
          ref: d97971e24500218865c05ed1febdee2acf41bae1
          path: .work/runtime-026
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the pinned generator
        run: npm ci
      - name: Record W12 native oracle twice
        shell: bash
        run: |
          python scripts/record_oracle.py --out=.work/oracle-a
          python scripts/record_oracle.py --out=.work/oracle-b
      - name: Require byte-identical W12 recordings
        run: python scripts/check_oracle_pair.py .work/oracle-a .work/oracle-b
      - name: Run all native gates on POSIX
        if: runner.os != 'Windows'
        run: python scripts/qualify/run.py --cc /usr/bin/cc --runtime .work/runtime-027 --support 0.25.1=.work/runtime-025 --support 0.26.13=.work/runtime-026 --out .work/native-full
      - name: Run all native gates on Windows
        if: runner.os == 'Windows'
        run: python scripts/qualify/run.py --cc C:/msys64/ucrt64/bin/gcc.exe --runtime .work/runtime-027 --support 0.25.1=.work/runtime-025 --support 0.26.13=.work/runtime-026 --out .work/native-full
      - name: Normalize release evidence
        run: python scripts/build_native_evidence.py --qualification .work/native-full --oracle-a .work/oracle-a --oracle-b .work/oracle-b --out .work/native-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            .work/native-evidence.json
            .work/native-full/identity.json
            .work/native-full/gates.json
            .work/native-full/runs.jsonl
            .work/oracle-a/manifest.json
            .work/oracle-b/manifest.json
          if-no-files-found: error
          retention-days: 7

  three-os-parity:
    needs: native-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: native-*
          path: .work/parity
      - name: Compare exact normalized outcomes
        run: python scripts/compare_native_evidence.py --windows .work/parity/native-windows-2025-vs2026/native-evidence.json --ubuntu .work/parity/native-ubuntu-24.04/native-evidence.json --macos .work/parity/native-macos-15/native-evidence.json
      - name: Make bounded source-only release evidence
        run: python scripts/package_native_evidence.py --windows .work/parity/native-windows-2025-vs2026 --ubuntu .work/parity/native-ubuntu-24.04 --macos .work/parity/native-macos-15 --out .work/parity/v0.1.4-native-evidence.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.1.4-native-evidence
          path: .work/parity/v0.1.4-native-evidence.zip
          if-no-files-found: error
          retention-days: 7
