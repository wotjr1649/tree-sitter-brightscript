name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit (docs/provenance/upstream-sources.md "Hosted CI actions").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical v0.1.2 replay needs its exact commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the pinned generator
        run: npm ci
      - name: V0 static checks
        run: python scripts/check_v0.py
      - name: Generator identity, regeneration drift and determinism
        run: python scripts/check_generated.py
      - name: Verified CLI path self-test
        run: python scripts/test_tscli.py
      - name: Offline replay and maintenance controls
        run: |
          python scripts/test_replay_compare.py
          python scripts/test_public_verifier.py
          python scripts/test_maintenance.py
          python scripts/test_maintenance_012.py
          python scripts/test_maintenance_screen.py
      - name: Registry, catalogue and corpus consistency
        run: python scripts/check_registry.py --complete
      - name: Schema reconciliation and catalogue
        run: python scripts/check_schema.py
      - name: Corpus
        # Verified binary, private parser library and configuration (validation.md "Identity binding").
        run: python scripts/tscli.py test
      - name: Composite samples (W03) and equivalent spellings (W05)
        run: |
          python scripts/check_samples.py
          python scripts/check_spellings.py
      - name: Robustness (W06, W07, W08, W13 with fuzzing)
        run: |
          python scripts/test_robustness_units.py
          python scripts/check_robustness.py
      - name: Incremental edits (W10) and literal-false spike criteria C4, C5
        run: |
          python scripts/check_incremental.py
          python scripts/check_spike.py
      - name: Prepare historical v0.1.2 public replay inputs
        run: python scripts/prepare_public_replay.py --out=.work/public-replay --historical-v012
      - name: Offline public replay from exported candidate source
        run: python -I -B -X utf8 scripts/verify_public.py --bundle .work/public-replay/verification/baseline --baseline-source .work/public-replay/verification/baseline-source --candidate-source .work/public-replay/source --candidate-registration .work/public-replay/verification/candidate-registration.json
      - name: No tracked changes
        shell: bash
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
