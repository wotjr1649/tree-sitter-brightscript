name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit (docs/provenance/upstream-sources.md "Hosted CI actions").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install the pinned generator
        run: npm ci
      - name: V0 static checks
        run: python scripts/check_v0.py
      - name: Generator identity, regeneration drift and determinism
        run: python scripts/check_generated.py
      - name: Registry, catalogue and corpus consistency
        run: python scripts/check_registry.py --complete
      - name: Schema reconciliation and catalogue
        run: python scripts/check_schema.py
      - name: Corpus
        run: npx tree-sitter test
        env:
          # Private parser library and configuration (validation.md "Identity binding").
          TREE_SITTER_LIBDIR: ${{ runner.temp }}/tree-sitter-lib
          TREE_SITTER_DIR: ${{ runner.temp }}/tree-sitter-config
      - name: Composite samples (W03) and equivalent spellings (W05)
        run: |
          python scripts/check_samples.py
          python scripts/check_spellings.py
      - name: Robustness (W06, W07, W08, W13 with fuzzing)
        run: python scripts/check_robustness.py
      - name: Incremental edits (W10) and literal-false spike criteria C4, C5
        run: |
          python scripts/check_incremental.py
          python scripts/check_spike.py
      - name: No tracked changes
        shell: bash
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
