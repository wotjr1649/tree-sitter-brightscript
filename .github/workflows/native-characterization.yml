name: Native build characterization

on:
  workflow_dispatch:
  push:
    branches: [session/10-v014-native-parity]
    paths:
      - .github/workflows/native-characterization.yml
      - scripts/qualify/characterize.py

permissions:
  contents: read

jobs:
  characterize:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04, macos-15]
        trial: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TSQ_TRIAL: ${{ matrix.trial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tree-sitter/tree-sitter
          ref: 6070dbfefd326bd735e5683eb128cc1b57dad0c0
          path: .work/runtime-027
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: npm ci
      - name: Characterize POSIX builds
        if: runner.os != 'Windows'
        run: python scripts/qualify/run.py --characterize --cc /usr/bin/cc --runtime .work/runtime-027 --out .work/native-characterization
      - name: Characterize Windows builds
        if: runner.os == 'Windows'
        run: python scripts/qualify/run.py --characterize --cc C:/mingw64/bin/gcc.exe --runtime .work/runtime-027 --out .work/native-characterization
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: characterization-${{ matrix.os }}-${{ matrix.trial }}
          path: |
            .work/native-characterization/identity.json
            .work/native-characterization/characterization.json
            .work/native-characterization/runs.jsonl
            .work/native-characterization/commands.jsonl
          if-no-files-found: error
          retention-days: 14
